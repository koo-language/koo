no-resolv
no-hosts
port=53
listen-address=127.0.0.1,::1
bind-interfaces
addn-hosts=/x/dns/hosts.big
host-record=four.dns,127.0.0.1
host-record=six.dns,::1
host-record=both.dns,127.0.0.1,::1
cname=cname.dns,four.dns
cname=cname6.dns,six.dns
cname=c1.dns,c2.dns
cname=c2.dns,c3.dns
cname=c3.dns,four.dns
host-record=db.ns.svc.cluster.local,127.0.0.1
host-record=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.dns,127.0.0.1
log-queries
log-facility=/tmp/dnsmasq.log
