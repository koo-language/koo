name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Every program the tests run looks its own tables over as it goes, and ends at once
    # if one is not as it should be.
    env:
      KOO_CHECK: "1"
      # The check of a server under load has eight actors run out of stack at the same
      # moment, six times over: a fault in what happens then showed itself one time in
      # three or so, and only on x86-64.
      CHECK_PANICS: "5"
    steps:
      - uses: actions/checkout@v4
      - name: clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-rt-dev lld
      # The tests of `std/sql` run against this server; where there is none, as on
      # macOS, they only check that the programs compile.
      - name: PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name koo-postgres -e POSTGRES_PASSWORD=koo-ci -p 5432:5432 postgres:16
          for attempt in $(seq 60); do
            docker exec koo-postgres pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          echo "KOO_TEST_POSTGRES=postgres://postgres:koo-ci@localhost:5432/postgres" >> "$GITHUB_ENV"
      # A Redis, for the client of `packages/redis` and the package it is written on.
      - name: Redis (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name koo-redis -p 6379:6379 redis:7-alpine
          for attempt in $(seq 60); do
            docker exec koo-redis redis-cli ping | grep -q PONG && break
            sleep 1
          done
          echo "KOO_TEST_REDIS=redis://localhost:6379" >> "$GITHUB_ENV"
      # The same tests again over TLS: a server with a certificate signed by an authority
      # made here, which the tests are told to trust.
      - name: PostgreSQL with TLS (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/certs" && cd "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=koo test authority" -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > names.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 -extfile names.cnf -out server.crt
          chmod 644 server.key
          docker run -d --name koo-postgres-tls -e POSTGRES_PASSWORD=koo-ci -p 5433:5432 -v "$PWD":/certs:ro postgres:16 \
            sh -c 'cp -r /certs /own && chown -R postgres /own && chmod 600 /own/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/own/server.crt -c ssl_key_file=/own/server.key'
          for attempt in $(seq 60); do
            docker exec koo-postgres-tls pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          echo "KOO_TEST_POSTGRES_TLS=postgres://postgres:koo-ci@localhost:5433/postgres?sslmode=verify-full&sslrootcert=$PWD/ca.crt" >> "$GITHUB_ENV"
      # The two Linux targets are what `koo build --target` builds for: with them
      # installed the compiler carries their C library, and the tests must find it.
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - run: echo "KOO_TEST_TARGETS=1" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The same programs again, each built as `--target` builds it for the machine it is
      # on, with everything linked in: that is what is deployed. Without the database
      # over TLS, which such a program does not speak.
      - name: the suite, with every program built for the target (Linux)
        if: runner.os == 'Linux'
        run: |
          target=linux-$(uname -m | sed 's/x86_64/x86-64/; s/aarch64/arm64/')
          env -u KOO_TEST_POSTGRES_TLS KOO_TARGET=$target cargo test -p koo --test programs
      # A server under the kinds of load that have broken it before: hundreds of
      # handlers asking actors at once, workers killed, peers that say half of
      # something, a table with no room left. Each check passes or fails.
      - name: a server under load
        run: |
          ulimit -n 16384 || ulimit -n "$(ulimit -Hn)"
          python3 tests/stress/check.py target/debug/koo
      - name: a server under load, built for the target (Linux)
        if: runner.os == 'Linux'
        run: |
          ulimit -n 16384 || ulimit -n "$(ulimit -Hn)"
          target=linux-$(uname -m | sed 's/x86_64/x86-64/; s/aarch64/arm64/')
          python3 tests/stress/check.py target/debug/koo --target $target
      # The support library built so that ThreadSanitizer sees inside it, and every
      # test program with actors or threads run with it: a race in the library's own
      # tables is a failure. That build takes a nightly compiler.
      - name: races inside the support library (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal
          sh tests/stress/races.sh target/debug/koo
      # The arithmetic of `Decimal` against Python's `decimal` set as decimal128 is, and
      # against exact fractions for what divides: a hundred thousand sums, each to the
      # digit, the exponent and whether it was rounded. A run says its seed.
      - name: the arithmetic of Decimal, against another's
        run: python3 tests/decimal/differential.py --cases 100000
      # What is nearly right, thrown at every reader the support library has of what
      # comes from outside: requests, bodies of JSON, and the answers of another
      # server, of a database and of a Redis. The server must go on, with the workers
      # it had. A run says its seed, and the same seed throws the same again.
      - name: readers of what comes from outside
        run: python3 tests/stress/fuzz.py target/debug/koo --seconds 8
      # And with the library built so that AddressSanitizer sees inside it: a read or
      # a write beyond what was allocated is then a failure, where otherwise it may be
      # nothing that anyone sees.
      - name: readers of what comes from outside, under the address sanitizer (Linux)
        if: runner.os == 'Linux'
        run: sh tests/stress/fuzz.sh target/debug/koo 10
